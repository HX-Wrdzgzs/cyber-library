name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests -v
      - run: cyber-library isbn 0-306-40615-2
      - run: cyber-library space 9780306406157
      - run: cyber-library categories
      - run: cyber-library-scale status --db /tmp/cyber-scale.sqlite3
      - run: cyber-library-semantic status --db /tmp/cyber-semantic.sqlite3
      - run: cyber-library-source list
      - run: cyber-library-source status wikidata --cache /tmp/cyber-source-cache.sqlite3
      - run: cyber-library-source status crossref --cache /tmp/cyber-source-cache.sqlite3
      - run: cyber-library-source status loc --cache /tmp/cyber-source-cache.sqlite3
      - run: cyber-library-refresh status --db /tmp/cyber-refresh.sqlite3
      - run: cyber-library-knowledge concept test --db /tmp/cyber-knowledge.sqlite3
      - run: cyber-library-benchmark bulk --records 12 --workdir /tmp/cyber-benchmark
      - run: cyber-library-export universe --db /tmp/cyber-export.sqlite3 --out /tmp/cyber-universe --max-level 1
      - run: cyber-library-export analyses --db /tmp/cyber-export.sqlite3 --out /tmp/cyber-analyses
      - run: cyber-library-deploy status
