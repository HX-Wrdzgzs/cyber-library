name: Add ISBN to Catalog

on:
  workflow_dispatch:
    inputs:
      isbn:
        description: ISBN-10 or ISBN-13 to add
        required: true
        type: string
      contact:
        description: Optional contact email for identified Open Library requests
        required: false
        type: string
      overwrite:
        description: Replace an existing committed record for this ISBN
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cyber-library-catalog-main
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      CATALOG_ISBN: ${{ inputs.isbn }}
      CATALOG_CONTACT: ${{ inputs.contact }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .

      - name: Resolve and write ISBN record
        if: ${{ !inputs.overwrite }}
        run: cyber-library-catalog add-isbn "$CATALOG_ISBN" --contact "$CATALOG_CONTACT"

      - name: Resolve and overwrite ISBN record
        if: ${{ inputs.overwrite }}
        run: cyber-library-catalog add-isbn "$CATALOG_ISBN" --contact "$CATALOG_CONTACT" --overwrite

      - name: Validate sourced catalog
        run: cyber-library-catalog validate
      - name: Validate repository references
        run: cyber-library-references check
      - name: Validate Markdown links
        run: cyber-library-github check
      - name: Validate browser JavaScript
        run: |
          node --check web/github.js
          node --check web/app.js
          node --check web/knowledge.js
      - name: Build GitHub-only site
        run: cyber-library-github build --out _site
      - name: Upload validated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-library-catalog-site-${{ github.run_id }}
          path: _site
          if-no-files-found: error

      - name: Commit catalog change directly to main
        shell: bash
        run: |
          if git diff --quiet -- data/catalog; then
            echo "No catalog change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog
          git commit -m "data: add ISBN ${CATALOG_ISBN}"
          git push origin HEAD:main
