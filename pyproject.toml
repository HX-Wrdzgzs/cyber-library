[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-library"
version = "3.1.0"
description = "Evidence-aware global book catalog, knowledge graph, analysis engine and ISBN universe."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cyber Library contributors"}]
keywords = ["books", "isbn", "open-library", "knowledge-graph", "library", "github-pages"]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]
s3 = ["boto3>=1.35,<2"]
deploy = ["psycopg[binary]>=3.2,<4", "boto3>=1.35,<2"]

[project.scripts]
cyber-library = "cyber_library.cli:main"
cyber-library-scale = "cyber_library.scale_cli:main"
cyber-library-semantic = "cyber_library.semantic_cli:main"
cyber-library-source = "cyber_library.source_cli:main"
cyber-library-refresh = "cyber_library.refresh_cli:main"
cyber-library-knowledge = "cyber_library.navigation_cli:main"
cyber-library-benchmark = "cyber_library.benchmark_cli:main"
cyber-library-export = "cyber_library.export_cli:main"
cyber-library-deploy = "cyber_library.deployment_cli:main"
cyber-library-github = "cyber_library.github_site:main"

[tool.setuptools.packages.find]
where = ["src"]
