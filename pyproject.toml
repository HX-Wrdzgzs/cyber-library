[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-library"
version = "0.1.0"
description = "GitHub-first prototype for an AI-assisted global book knowledge map."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cyber-library = "cyber_library.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
